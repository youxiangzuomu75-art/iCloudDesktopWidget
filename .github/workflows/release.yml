name: Publish calendar update

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version from application
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import ast; p=ast.parse(open('icloud_widget.py',encoding='utf-8').read()); print(next(n.value.value for n in p.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='VERSION' for t in n.targets)))")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          python3 -m py_compile icloud_widget.py
      - name: Publish app and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'icloud_widget.py'; then
            echo "Assets already exist for $TAG; skipping"
            exit 0
          fi
          sha256sum icloud_widget.py > icloud_widget.py.sha256
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          gh release upload "$TAG" icloud_widget.py icloud_widget.py.sha256 --clobber
